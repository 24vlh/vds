name: VDS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout VDS
        uses: actions/checkout@v4
        with:
          path: vds

      - name: Checkout agents metadata tooling
        uses: actions/checkout@v4
        with:
          repository: 24vlh/agents
          path: agents
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Show tool versions
        working-directory: vds
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        working-directory: vds
        run: pnpm install --frozen-lockfile

      - name: Resolve system Chromium
        working-directory: vds
        run: |
          CHROME="$(command -v chromium-browser || command -v chromium || command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chromium was not found. Install chromium-browser or provide a system Chrome binary for VDS_CHROMIUM."
            exit 1
          fi
          echo "VDS_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Run read-only audit gates
        working-directory: vds
        run: pnpm run audit
